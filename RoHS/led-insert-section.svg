<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="1000" viewBox="0 0 1500 1000" font-family="monospace">
<rect width="1500" height="1000" fill="#0d1117"/>
<text x="40.0" y="46.0" fill="#e6edf3" font-size="26" text-anchor="start" font-weight="bold">Status-LED window: the ESD insert and the pocket that makes room for it</text>
<text x="40.0" y="76.0" fill="#8b949e" font-size="17" text-anchor="start" font-weight="normal">Section through D5. EMC-700 left ±8 kV air discharge NOT RATED at these openings;</text>
<text x="40.0" y="100.0" fill="#8b949e" font-size="17" text-anchor="start" font-weight="normal">the bonded insert means the opening does not exist on a shipped unit.</text>
