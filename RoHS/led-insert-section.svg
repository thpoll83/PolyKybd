<path d="M 212.70,476.00 L 532.00,476.00 L 532.00,407.80 L 212.70,407.80 Z" fill="#3d4756" fill-opacity="1.0" stroke="#8b949e" stroke-width="1.5"/>
<path d="M 367.98,531.80 L 491.98,531.80 L 491.98,476.00 L 367.98,476.00 Z" fill="#f0b429" fill-opacity="0.8" stroke="#f0b429" stroke-width="1.5"/>
<text x="62.0" y="242.0" fill="#3fb950" font-size="15" text-anchor="start" font-weight="normal">the outer surface is untouched — no pocket, nothing</text>
<text x="62.0" y="264.0" fill="#3fb950" font-size="15" text-anchor="start" font-weight="normal">for a blade to engage. The cone seats on its own taper,</text>
<text x="62.0" y="286.0" fill="#3fb950" font-size="15" text-anchor="start" font-weight="normal">so the gap is only a bond line: 0.08 mm perpendicular,</text>
<text x="62.0" y="308.0" fill="#3fb950" font-size="15" text-anchor="start" font-weight="normal">0.085 mm as the ring you see round the Ø1.6 aperture.</text>
<line x1="119.7" y1="856.0" x2="299.5" y2="856.0" stroke="#e6edf3" stroke-width="2.5"/>
<line x1="119.7" y1="849.0" x2="119.7" y2="863.0" stroke="#e6edf3" stroke-width="2.5"/>
<line x1="299.5" y1="849.0" x2="299.5" y2="863.0" stroke="#e6edf3" stroke-width="2.5"/>
<text x="209.6" y="890.0" fill="#e6edf3" font-size="20" text-anchor="middle" font-weight="bold">wall 2.9 mm</text>
<line x1="237.5" y1="800.0" x2="299.5" y2="800.0" stroke="#58a6ff" stroke-width="2.5"/>
<line x1="237.5" y1="793.0" x2="237.5" y2="807.0" stroke="#58a6ff" stroke-width="2.5"/>
<line x1="299.5" y1="793.0" x2="299.5" y2="807.0" stroke="#58a6ff" stroke-width="2.5"/>
<text x="268.5" y="834.0" fill="#58a6ff" font-size="20" text-anchor="middle" font-weight="bold">pocket 1.0</text>
<line x1="216.7" y1="476.0" x2="535.3" y2="476.0" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="541.3" y="481.0" fill="#8b949e" font-size="13" text-anchor="start" font-weight="normal">ledge top / PCB  11.5</text>
<line x1="241.5" y1="507.0" x2="535.3" y2="507.0" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="541.3" y="512.0" fill="#58a6ff" font-size="13" text-anchor="start" font-weight="normal">pocket top  11.0</text>
<line x1="303.5" y1="600.0" x2="535.3" y2="600.0" stroke="#3d4756" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="541.3" y="605.0" fill="#3d4756" font-size="13" text-anchor="start" font-weight="normal">cone base  Ø2.69</text>
<line x1="241.5" y1="730.2" x2="535.3" y2="730.2" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="541.3" y="735.2" fill="#58a6ff" font-size="13" text-anchor="start" font-weight="normal">pocket floor  7.4</text>
<rect x="760.0" y="150.0" width="700.0" height="790.0" fill="none" stroke="#21262d" stroke-width="1"/>
<text x="780.0" y="182.0" fill="#e6edf3" font-size="19" text-anchor="start" font-weight="normal">B — the alternative: led_fit_from = "outside"</text>
<text x="780.0" y="206.0" fill="#3d4756" font-size="15" text-anchor="start" font-weight="normal">same modules, the pocket cut into the other face</text>
<path d="M 839.70,779.80 L 1019.50,779.80 L 1019.50,476.00 L 932.70,476.00 L 932.70,370.60 L 839.70,370.60 Z" fill="#21262d" fill-opacity="1.0" stroke="#8b949e" stroke-width="2"/>
<path d="M 839.70,606.20 L 1019.50,606.20 L 1019.50,469.80 L 839.70,469.80 Z" fill="#0d1117" fill-opacity="1.0" stroke="#3d4756" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M 839.70,730.20 L 901.70,730.20 L 901.70,476.00 L 839.70,476.00 Z" fill="#0d1117" fill-opacity="1.0" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5 3"/>
<path d="M 839.70,649.60 L 932.70,683.45 L 1019.50,683.45 L 1019.50,516.55 L 932.70,516.55 L 839.70,550.40 Z" fill="#0d1117" fill-opacity="1.0" stroke="#3d4756" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M 839.70,644.32 L 932.70,678.17 L 1019.50,667.95 L 1019.50,532.05 L 932.70,532.05 L 932.70,521.83 L 839.70,555.68 Z" fill="#3fb950" fill-opacity="0.45" stroke="#3fb950" stroke-width="2"/>
<path d="M 839.70,722.76 L 894.26,722.76 L 894.26,483.44 L 839.70,483.44 Z" fill="#3fb950" fill-opacity="0.45" stroke="#3fb950" stroke-width="2"/>
<path d="M 932.70,476.00 L 1252.00,476.00 L 1252.00,407.80 L 932.70,407.80 Z" fill="#3d4756" fill-opacity="1.0" stroke="#8b949e" stroke-width="1.5"/>
<path d="M 1087.98,531.80 L 1211.98,531.80 L 1211.98,476.00 L 1087.98,476.00 Z" fill="#f0b429" fill-opacity="0.8" stroke="#f0b429" stroke-width="1.5"/>
<text x="782.0" y="242.0" fill="#f0b429" font-size="15" text-anchor="start" font-weight="normal">better against the load that actually happens:</text>
<text x="782.0" y="264.0" fill="#f0b429" font-size="15" text-anchor="start" font-weight="normal">pressure from outside seats the flange on the</text>
<text x="782.0" y="286.0" fill="#f0b429" font-size="15" text-anchor="start" font-weight="normal">pocket floor instead of pushing the part in —</text>
<text x="782.0" y="308.0" fill="#f0b429" font-size="15" text-anchor="start" font-weight="normal">but it puts a visible seam on the outer face.</text>
<text x="782.0" y="856.0" fill="#f85149" font-size="15" text-anchor="start" font-weight="normal">Inside: only the bond resists a push from outside.</text>
<text x="782.0" y="878.0" fill="#f85149" font-size="15" text-anchor="start" font-weight="normal">Outside: only the bond resists a pull. Either way</text>
<text x="782.0" y="900.0" fill="#f85149" font-size="15" text-anchor="start" font-weight="normal">the bond is not optional — see the QC note.</text>
<text x="40.0" y="1038.0" fill="#8b949e" font-size="16" text-anchor="start" font-weight="normal">D1, D5 and D6.</text>
<text x="40.0" y="1014.0" fill="#8b949e" font-size="16" text-anchor="start" font-weight="normal">top so the PCB keeps its full 1.25 mm of support. ONE part, three per half: the section is the same at</text>
<text x="40.0" y="990.0" fill="#8b949e" font-size="16" text-anchor="start" font-weight="normal">cone, 0.25 mm for the buried cylinder behind it. The inside pocket stops 0.5 mm below the ledge</text>
<text x="40.0" y="966.0" fill="#8b949e" font-size="16" text-anchor="start" font-weight="normal">from the same modules, so they cannot drift. 0.12 mm per face on the flange in its pocket, 0.08 mm on the</text>
<text x="40.0" y="942.0" fill="#8b949e" font-size="16" text-anchor="start" font-weight="normal">READ from the led_* parameters in case/case_polykybd_split72_lr.scad — the pocket and the insert come</text>
</svg>