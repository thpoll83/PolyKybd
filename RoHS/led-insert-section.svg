<text x="780.0" y="182.0" fill="#e6edf3" font-size="19" text-anchor="start" font-weight="normal">B — the seam, and why it is bonded</text>
<text x="780.0" y="206.0" fill="#3d4756" font-size="15" text-anchor="start" font-weight="normal">the path is long, but the bond is what the design rests on</text>
