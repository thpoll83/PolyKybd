<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="1060" viewBox="0 0 1500 1060" font-family="monospace">
<rect width="1500" height="1060" fill="#0d1117"/>
<text x="40.0" y="46.0" fill="#e6edf3" font-size="26" text-anchor="start" font-weight="bold">Status-LED window: the ESD insert and the pocket that makes room for it</text>
<text x="40.0" y="76.0" fill="#8b949e" font-size="17" text-anchor="start" font-weight="normal">Section through D5, on the window axis. EMC-700 left ±8 kV air discharge NOT RATED at these</text>
<text x="40.0" y="100.0" fill="#8b949e" font-size="17" text-anchor="start" font-weight="normal">openings; the bonded insert means the opening does not exist on a shipped unit.</text>
<rect x="40.0" y="150.0" width="690.0" height="790.0" fill="none" stroke="#21262d" stroke-width="1"/>
<text x="60.0" y="182.0" fill="#e6edf3" font-size="19" text-anchor="start" font-weight="normal">A — as built: fitted from the INSIDE</text>
<text x="60.0" y="206.0" fill="#3d4756" font-size="15" text-anchor="start" font-weight="normal">green = insert, blue dashed = pocket, grey dashed = the window</text>
