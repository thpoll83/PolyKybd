<text x="60.0" y="182.0" fill="#e6edf3" font-size="19" text-anchor="start" font-weight="normal">A — as built, with the insert bonded in</text>
<text x="60.0" y="206.0" fill="#3d4756" font-size="15" text-anchor="start" font-weight="normal">green = insert, blue dashed = pocket, grey dashed = the original window</text>
