<circle cx="1019.5" cy="485.3" r="5" fill="#f85149"/>
<text x="975.0" y="806.0" fill="#f85149" font-size="17" text-anchor="start" font-weight="normal">pocket depth      1.0 mm</text>
<text x="975.0" y="830.0" fill="#f85149" font-size="17" text-anchor="start" font-weight="normal">+ flange overlap  3.5 mm</text>
<text x="975.0" y="854.0" fill="#f85149" font-size="17" text-anchor="start" font-weight="normal">+ wall under it   1.9 mm</text>
<line x1="971.0" y1="866.0" x2="1215.0" y2="866.0" stroke="#f85149" stroke-width="2"/>
<text x="975.0" y="892.0" fill="#f85149" font-size="19" text-anchor="start" font-weight="bold">= 6.4 mm of narrow gap</text>
<text x="975.0" y="916.0" fill="#8b949e" font-size="15" text-anchor="start" font-weight="normal">which the bond then closes entirely</text>
<text x="40.0" y="978.0" fill="#8b949e" font-size="16" text-anchor="start" font-weight="normal">one covers D1. Four per keyboard, printed in clear resin.</text>
<text x="40.0" y="954.0" fill="#8b949e" font-size="16" text-anchor="start" font-weight="normal">insert come from the same modules, so they cannot drift. Two parts per half: one spans D5+D6,</text>
<text x="40.0" y="930.0" fill="#8b949e" font-size="16" text-anchor="start" font-weight="normal">Derived from the led_* parameters in case/case_polykybd_split72_lr.scad — the pocket and the</text>
