<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="1000" viewBox="0 0 1500 1000" font-family="monospace">
<rect width="1500" height="1000" fill="#0d1117"/>
<text x="40.0" y="46.0" fill="#e6edf3" font-size="26" text-anchor="start" font-weight="bold">The top of the insert: relieved under the board, not shaved flat</text>
<text x="40.0" y="76.0" fill="#8b949e" font-size="17" text-anchor="start" font-weight="normal">Section through D5, looking along the wall. The boss is cut back where it would run under the</text>
<text x="40.0" y="100.0" fill="#8b949e" font-size="17" text-anchor="start" font-weight="normal">ledge the PCB rests on; the rest of it is the only thing closing the top of the window.</text>
<rect x="40.0" y="160.0" width="690.0" height="700.0" fill="none" stroke="#21262d" stroke-width="1"/>
<text x="60.0" y="192.0" fill="#e6edf3" font-size="19" text-anchor="start" font-weight="normal">A — as built: relieved under the ledge</text>
<text x="60.0" y="216.0" fill="#3d4756" font-size="15" text-anchor="start" font-weight="normal">green = insert, blue dashed = pocket, grey dashed = the window</text>
<path d="M 86.95,821.00 L 426.25,821.00 L 426.25,528.50 L 262.45,528.50 L 262.45,399.80 L 86.95,399.80 Z" fill="#21262d" fill-opacity="1.0" stroke="#8b949e" stroke-width="2"/>
<path d="M 262.45,528.50 L 584.20,528.50 L 584.20,423.20 L 262.45,423.20 Z" fill="#3d4756" fill-opacity="1.0" stroke="#8b949e" stroke-width="1.5"/>
<path d="M 86.95,774.20 L 426.25,774.20 L 426.25,516.80 L 86.95,516.80 Z" fill="#0d1117" fill-opacity="1.0" stroke="#3d4756" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M 309.25,821.00 L 426.25,821.00 L 426.25,587.00 L 309.25,587.00 Z" fill="#0d1117" fill-opacity="1.0" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5 3"/>
<path d="M 86.95,760.16 L 157.15,760.16 L 157.15,744.95 L 426.25,744.95 L 426.25,601.04 L 262.45,601.04 L 262.45,546.05 L 157.15,546.05 L 157.15,530.84 L 86.95,530.84 Z" fill="#3fb950" fill-opacity="0.45" stroke="#3fb950" stroke-width="2"/>
<path d="M 323.29,821.00 L 426.25,821.00 L 426.25,601.04 L 323.29,601.04 Z" fill="#3fb950" fill-opacity="0.45" stroke="#3fb950" stroke-width="2"/>
<line x1="266.4" y1="528.5" x2="467.6" y2="528.5" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="473.6" y="533.5" fill="#8b949e" font-size="13" text-anchor="start" font-weight="normal">ledge top / PCB  11.50</text>
<line x1="161.2" y1="530.8" x2="467.6" y2="554.5" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="473.6" y="559.5" fill="#3fb950" font-size="13" text-anchor="start" font-weight="normal">boss lip   11.48</text>
<line x1="430.2" y1="546.0" x2="467.6" y2="580.5" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="473.6" y="585.5" fill="#3fb950" font-size="13" text-anchor="start" font-weight="normal">boss body  11.35</text>
<line x1="313.2" y1="587.0" x2="467.6" y2="606.5" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="473.6" y="611.5" fill="#58a6ff" font-size="13" text-anchor="start" font-weight="normal">pocket top  11.00</text>
<line x1="327.3" y1="601.0" x2="467.6" y2="632.5" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="473.6" y="637.5" fill="#3fb950" font-size="13" text-anchor="start" font-weight="normal">flange top  10.88</text>
<text x="62.0" y="250.0" fill="#3fb950" font-size="15" text-anchor="start" font-weight="normal">Under the ledge the part now tops out at 10.88, so it</text>
<text x="62.0" y="272.0" fill="#3fb950" font-size="15" text-anchor="start" font-weight="normal">clears the board by 0.62 mm instead of 0.15. The window</text>
<text x="62.0" y="294.0" fill="#3fb950" font-size="15" text-anchor="start" font-weight="normal">is still plugged 1.50 mm deep from the OUTER face, so</text>
<text x="62.0" y="316.0" fill="#3fb950" font-size="15" text-anchor="start" font-weight="normal">what is left is a blind recess, not a path.</text>
<rect x="760.0" y="160.0" width="700.0" height="700.0" fill="none" stroke="#21262d" stroke-width="1"/>
<text x="780.0" y="192.0" fill="#e6edf3" font-size="19" text-anchor="start" font-weight="normal">B — the rest shaved off too</text>
<text x="780.0" y="216.0" fill="#3d4756" font-size="15" text-anchor="start" font-weight="normal">what taking the OUTER 1.5 mm as well would cost</text>
<path d="M 806.95,821.00 L 1146.25,821.00 L 1146.25,528.50 L 982.45,528.50 L 982.45,399.80 L 806.95,399.80 Z" fill="#21262d" fill-opacity="1.0" stroke="#8b949e" stroke-width="2"/>
<path d="M 982.45,528.50 L 1304.20,528.50 L 1304.20,423.20 L 982.45,423.20 Z" fill="#3d4756" fill-opacity="1.0" stroke="#8b949e" stroke-width="1.5"/>
<path d="M 806.95,774.20 L 1146.25,774.20 L 1146.25,516.80 L 806.95,516.80 Z" fill="#0d1117" fill-opacity="1.0" stroke="#3d4756" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M 1029.25,821.00 L 1146.25,821.00 L 1146.25,587.00 L 1029.25,587.00 Z" fill="#0d1117" fill-opacity="1.0" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5 3"/>
<path d="M 806.95,760.16 L 877.15,760.16 L 877.15,744.95 L 1146.25,744.95 L 1146.25,601.04 L 982.45,601.04 L 982.45,601.04 L 877.15,601.04 L 877.15,601.04 L 806.95,601.04 Z" fill="#3fb950" fill-opacity="0.45" stroke="#3fb950" stroke-width="2"/>
<path d="M 1043.29,821.00 L 1146.25,821.00 L 1146.25,601.04 L 1043.29,601.04 Z" fill="#3fb950" fill-opacity="0.45" stroke="#3fb950" stroke-width="2"/>
<path d="M 806.95,601.04 L 1146.25,601.04 L 1146.25,516.80 L 806.95,516.80 Z" fill="#f85149" fill-opacity="0.35" stroke="#f85149" stroke-width="2"/>
<text x="782.0" y="250.0" fill="#f85149" font-size="15" text-anchor="start" font-weight="normal">0.72 × 2.8 mm of the window is left open,</text>
<text x="782.0" y="272.0" fill="#f85149" font-size="15" text-anchor="start" font-weight="normal">straight through 2.9 mm of wall to the LED behind —</text>
<text x="782.0" y="294.0" fill="#f85149" font-size="15" text-anchor="start" font-weight="normal">which is the opening the insert exists to close.</text>
<text x="782.0" y="326.0" fill="#f0b429" font-size="15" text-anchor="start" font-weight="normal">The other way round — raising the FLANGE to meet the</text>
<text x="782.0" y="348.0" fill="#f0b429" font-size="15" text-anchor="start" font-weight="normal">boss — needs the pocket at 11.47, leaving 0.25 mm of</text>
<text x="782.0" y="370.0" fill="#f0b429" font-size="15" text-anchor="start" font-weight="normal">ledge under the board: a standing rib well under the</text>
<text x="782.0" y="392.0" fill="#f0b429" font-size="15" text-anchor="start" font-weight="normal">0.8 mm the print service allows.</text>
<text x="40.0" y="978.0" fill="#8b949e" font-size="16" text-anchor="start" font-weight="normal">part, 5% of it. Derived from the led_* parameters in case/case_polykybd_split72_lr.scad.</text>
<text x="40.0" y="954.0" fill="#8b949e" font-size="16" text-anchor="start" font-weight="normal">the window on its own. led_ledge_relief() takes off the slice that ran under the board: 1.5 mm³ per</text>
<text x="40.0" y="930.0" fill="#8b949e" font-size="16" text-anchor="start" font-weight="normal">clear 0.8 mm — that is what fixes the pocket top at 11.0, and why the boss has to carry the top of</text>
<text x="40.0" y="906.0" fill="#8b949e" font-size="16" text-anchor="start" font-weight="normal">Flange 0.88 mm thick in a 1.0 mm pocket; ledge 1.25 mm wide, so flange + remaining ledge cannot both</text>
</svg>